name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/fingerboard-3d-viewer-s77665]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves the site from /<repo>/, so the asset base has to match.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # Note: Pages has to be switched on once by hand (Settings -> Pages ->
      # Source: GitHub Actions). The workflow token is not allowed to create a
      # Pages site, so `enablement: true` here fails with "Resource not
      # accessible by integration" rather than doing it for you.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
